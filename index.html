<script>
var authorsData = [
  {author:"Александр Пушкин",quotes:["Я помню чудное мгновенье: передо мной явилась ты.","Чтение — вот лучшее учение.","Мы почитаем всех нулями, а единицами — себя.","Что пройдет, то будет мило.","Тьмы низких истин мне дороже нас возвышающий обман.","Не дай мне Бог сойти с ума. Нет, легче посох и сума.","Привычка свыше нам дана: замена счастию она."]},
  {author:"Фёдор Достоевский",quotes:["Красота спасёт мир.","Человек есть тайна. Её надо разгадать.","Страдание и боль всегда обязательны для широкого сознания и глубокого сердца.","Если хочешь победить весь мир, победи самого себя.","Любовь столь всесильна, что перерождает и нас самих.","Свобода не в том, чтоб не сдерживать себя, а в том, чтоб владеть собой.","Без детей нельзя было бы так любить человечество."]},
  {author:"Лев Толстой",quotes:["Все счастливые семьи похожи друг на друга, каждая несчастливая семья несчастлива по-своему.","В человеке всё должно быть прекрасно: и лицо, и одежда, и душа, и мысли.","Счастье не в том, чтобы делать всегда, что хочешь, а в том, чтобы всегда хотеть того, что делаешь.","Нет величия там, где нет простоты, добра и правды.","Слово — выражение мысли, и потому слово должно соответствовать тому, что оно выражает.","Все хотят изменить мир, но никто не хочет измениться сам.","Время — это самое дорогое, что у нас есть."]},
  {author:"Антон Чехов",quotes:["Краткость — сестра таланта.","Если хочешь, чтобы у тебя было мало времени, то ничего не делай.","Праздная жизнь не может быть чистой.","Надо быть ясным умственно, чистым нравственно и опрятным физически.","В человеке всё должно быть прекрасно: и лицо, и одежда, и душа, и мысли.","Берегись изысканного языка. Язык должен быть прост и изящен.","Человек — это то, во что он верит."]},
  {author:"Иван Тургенев",quotes:["Русский язык — великий, могучий, правдивый и свободный.","Всякая любовь счастливая, равно как и несчастная, — истинное бедствие, когда она безгранична.","Счастье — как здоровье: когда его не замечаешь, значит, оно есть.","Нет ничего тягостнее сознания только что сделанной глупости.","Дружба — это прежде всего примирение.","Отцы и дети — это вечная тема.","Россия — это страна, которую нужно понять."]},
  {author:"Николай Гоголь",quotes:["Нет уз святее товарищества.","Русь, куда ж несёшься ты? дай ответ. Не даёт ответа.","Смех — великое дело: он не отнимает ни жизни, ни имения, но перед ним виновный — как связанный заяц.","Чему смеётесь? Над собой смеётесь!","Всякий человек есть история, которой ещё никто не читал.","Мёртвые души — это мы.","Ревизор — это Россия."]},
  {author:"Михаил Лермонтов",quotes:["Всё это было бы смешно, когда бы не было так грустно.","Я не хочу, чтоб свет узнал мою таинственную повесть.","И скучно и грустно, и некому руку подать.","Есть чувства, которые не выразить словами.","Люблю отчизну я, но странною любовью!","Герой нашего времени — это я.","Парус одинокий — это душа."]},
  {author:"Сергей Есенин",quotes:["В этой жизни умереть не ново, но и жить, конечно, не новей.","Ты жива ещё, моя старушка? Жив и я. Привет тебе, привет!","Мне осталась одна забава: пальцы в рот — да весёлый свист.","Не жалею, не зову, не плачу.","Всё пройдёт, как с белых яблонь дым.","Я последний поэт деревни.","Русь советская — это я."]},
  {author:"Владимир Маяковский",quotes:["Светить всегда, светить везде, до дней последних донца.","Я знаю силу слов, я знаю слов набат.","Если звезды зажигают — значит, это кому-нибудь нужно?","Любовь — это сердце всего.","Громада любовь, громада ненависть.","Я хочу быть понят родной страной.","Ленин — это жил, Ленин — жив."]},
  {author:"Анна Ахматова",quotes:["Я была тогда с моим народом, там, где мой народ, к несчастью, был.","Сжала руки под тёмной вуалью.","Мне голос был. Он звал утешно.","У меня есть улыбка одна: так, движенье чуть видное губ.","Всё расхищено, предано, продано.","Реквием — это память.","Поэма без героя — это жизнь."]},
  {author:"Марина Цветаева",quotes:["Моим стихам, написанным так рано, что и не знала я, что я — поэт.","Мне нравится, что вы больны не мной.","В огромном липком свете дня, где всё сгорает, — я говорю тебе: прощай.","Идешь, на меня похожий, глаза устремляя вниз.","Ты — моя, я — твоя, но не вместе.","Мой Пушкин — это моя любовь."]},
  {author:"Борис Пастернак",quotes:["Во всём мне хочется дойти до самой сути.","Быть знаменитым некрасиво.","Любить иных — тяжёлый крест, а ты прекрасна без извилин.","Мело, мело по всей земле во все пределы.","И чем случайней, тем вернее слагаются стихи навзрыд.","Доктор Живаго — это я.","Гамлет — это каждый из нас."]},
  {author:"Михаил Булгаков",quotes:["Рукописи не горят.","Никогда и ничего не просите! Никогда и ничего, и в особенности у тех, кто сильнее вас.","Вторая свежесть — вот что вздор! Свежесть бывает только одна — первая, она же и последняя.","Злых людей нет на свете, есть только люди несчастливые.","Всё будет правильно, на этом построен мир.","Мастер и Маргарита — это любовь.","Собачье сердце — это мы."]},
  {author:"Владимир Набоков",quotes:["У меня нет никакой веры в будущее, но есть вера в прошлое.","Слово — это всё, что у нас есть.","Память — это единственный рай, из которого нас не могут изгнать.","Я думаю, что в конце концов всё сводится к любви.","Красота — это тайна, которую нельзя разгадать.","Лолита — это трагедия.","Дар — это жизнь."]},
  {author:"Александр Солженицын",quotes:["Жить не по лжи!","Один маленький шаг человека — один огромный шаг человечества.","Самый простой способ стать счастливым — делать добро.","В мире нет ничего более сильного, чем правда.","Образованщина — это люди, которые много читали, но ничего не поняли.","Архипелаг ГУЛАГ — это память.","Матрёнин двор — это Россия."]},
  {author:"Михаил Шолохов",quotes:["Тихий Дон — это река жизни.","Судьба человека — это судьба народа.","Любовь к родине — самое сильное чувство.","Казак без коня — что птица без крыльев.","Земля — наша кормилица.","Поднятая целина — это история.","Они сражались за родину — это подвиг."]},
  {author:"Максим Горький",quotes:["Человек — это звучит гордо!","В жизни всегда есть место подвигу.","Книга — источник знаний.","Учиться никогда не поздно.","Правда — самое могучее оружие.","Мать — это жизнь.","На дне — это мы."]},
  {author:"Иван Бунин",quotes:["О счастье мы всегда лишь вспоминаем. А счастье всюду.","Милосердие — это когда делаешь добро, не думая о награде.","Любовь — это когда хочется жить.","Тёмные аллеи — это жизнь.","Я живу и не перестаю удивляться миру.","Господин из Сан-Франциско — это смерть.","Лёгкое дыхание — это красота."]},
  {author:"Александр Блок",quotes:["И вечный бой! Покой нам только снится.","Ночь, улица, фонарь, аптека, бессмысленный и тусклый свет.","О, я хочу безумно жить.","Россия — сфинкс. Ликуя и скорбя, и обливаясь чёрной кровью.","Девушка пела в церковном хоре о всех усталых в чужом краю.","Двенадцать — это революция.","Незнакомка — это тайна."]},
  {author:"Николай Некрасов",quotes:["Поэтом можешь ты не быть, но гражданином быть обязан.","Кому на Руси жить хорошо.","Есть женщины в русских селеньях.","Сейте разумное, доброе, вечное.","Я лиру посвятил народу своему.","Русские женщины — это подвиг.","Мороз, Красный нос — это красота."]},
  {author:"Фёдор Тютчев",quotes:["Умом Россию не понять.","Я встретил вас — и всё былое в отжившем сердце ожило.","Есть в осени первоначальной короткая, но дивная пора.","Нам не дано предугадать, как слово наше отзовётся.","Люблю грозу в начале мая.","Silentium! — это молчание.","Весенние воды — это жизнь."]},
  {author:"Афанасий Фет",quotes:["Я пришёл к тебе с приветом, рассказать, что солнце встало.","Шёпот, робкое дыханье, трели соловья.","Это утро, радость эта, эта мощь и дня и света.","Учись у них — у дуба, у берёзы.","На заре ты её не буди.","Вечерние огни — это грусть.","Поэзия — это красота."]},
  {author:"Александр Грибоедов",quotes:["Служить бы рад, прислуживаться тошно.","Свежо предание, а верится с трудом.","Счастливые часов не наблюдают.","Дома новы, но предрассудки стары.","Всё врут календари.","Горе от ума — это трагедия.","Мильон терзаний — это жизнь."]},
  {author:"Николай Карамзин",quotes:["История — это священная книга народов.","И крестьянки любить умеют.","Всякое настоящее образование добывается только путем самообразования.","Слава — это дым.","Россия — это Европа, только другая.","Бедная Лиза — это сентиментализм.","История государства Российского — это труд."]},
  {author:"Денис Фонвизин",quotes:["Не хочу учиться, а хочу жениться.","Вот злонравия достойные плоды.","Говорить правду — терять дружбу.","Смеяться, право, не грешно над тем, что кажется смешно.","Видно, братец, глуп ты от рождения.","Недоросль — это комедия.","Бригадир — это сатира."]},
  {author:"Василий Жуковский",quotes:["О милых спутниках, которые наш свет своим сопутствием для нас животворили, не говори с тоской: их нет, но с благодарностию: были.","Из всех блаженств, что нам даны, любовь — блаженнее всего.","Кто сердцем чист, тот в мире не один.","Надежда — это сладкий сон души.","Стихи — это язык богов.","Светлана — это баллада.","Море — это стихия."]},
  {author:"Константин Бальмонт",quotes:["Я люблю тебя больше, чем Небо, и больше, чем Солнце.","Будем как солнце, оно — молодое.","Я — изысканность русской медлительной речи.","Мир красоты — это мир вечной юности.","Слова — это тени дел.","Символизм — это жизнь.","Фейные сказки — это детство."]},
  {author:"Игорь Северянин",quotes:["Я, гений Игорь Северянин, своей победой упоён.","Это было у моря, где волна бьёт жемчугами.","Я закован в цепи, я — поэт.","Мир — это лотос, раскрытый в небе.","Всё пройдёт, и всё вернётся.","Ананасы в шампанском — это эпатаж.","Громокипящий кубок — это жизнь."]},
  {author:"Велимир Хлебников",quotes:["Я — зодчий, я — творец миров.","Слово — это знамя.","Время — это вещество.","Мы — будетляне.","Будетляне — люди будущего.","Заумь — это язык.","Председатель земного шара — это я."]},
  {author:"Осип Мандельштам",quotes:["Я вернулся в мой город, знакомый до слёз.","За гремучую доблесть грядущих веков.","Бессонница. Гомер. Тугие паруса.","Мы живём, под собою не чуя страны.","Бытие — это текст.","Камень — это поэзия.","Tristia — это печаль."]},
  {author:"Николай Заболоцкий",quotes:["Не позволяй душе лениться.","Я воспитан природой суровой.","Душа обязана трудиться и день и ночь, и день и ночь.","Мир — это симфония.","Любовь — это вечный двигатель.","Столбцы — это абсурд.","Метаморфозы — это жизнь."]},
  {author:"Александр Твардовский",quotes:["Василий Тёркин — это я.","Просто парень сам собой он обыкновенный.","Нельзя о смерти думать, брат.","Родина — это ты и я.","Война — это горе, а мир — это счастье.","За далью — даль — это путь.","По праву памяти — это совесть."]},
  {author:"Константин Симонов",quotes:["Жди меня, и я вернусь, только очень жди.","Скажи, что ты меня любишь, и я умру счастливым.","Война — это не только смерть, но и жизнь.","Ты вспоминаешь родину, а я — тебя.","Солдатами не рождаются, солдатами становятся.","Живые и мёртвые — это память.","Дни и ночи — это подвиг."]},
  {author:"Василий Шукшин",quotes:["Нравственность — это правда.","Родина — это не место, а состояние души.","Жить надо так, чтобы не было стыдно.","Человек должен быть добрым.","Простота — это высшая мудрость.","Калина красная — это судьба.","Характеры — это жизнь."]},
  {author:"Валентин Распутин",quotes:["Человек должен жить на своей земле.","Память — это совесть.","Жизнь — это долг.","Природа — наш дом.","Доброта спасёт мир.","Прощание с Матёрой — это боль.","Уроки французского — это детство."]},
  {author:"Виктор Астафьев",quotes:["Мы в ответе за тех, кого приручили.","Любовь — это труд.","Красота — это спасение.","Родина — это моя боль.","Память — это единственный рай.","Царь-рыба — это природа.","Последний поклон — это память."]},
  {author:"Владимир Высоцкий",quotes:["Я не люблю, когда мне лезут в душу.","Кони привередливые — это мы.","Никогда не вернусь, если не вернусь я.","Баллада о любви — это жизнь.","Я дышу, и значит, я живу.","Корабли — это судьба.","Он не вернулся из боя — это память."]},
  {author:"Булат Окуджава",quotes:["Возьмёмся за руки, друзья, чтоб не пропасть поодиночке.","Виноградная косточка — это мы.","Надежды маленький оркестрик.","Не бойся, я с тобой.","Молитва — это разговор с Богом.","Полночный троллейбус — это надежда.","Арбат — это детство."]},
  {author:"Иосиф Бродский",quotes:["Ни страны, ни погоста не хочу выбирать.","Я памятник себе воздвиг иной.","Смерть — это то, что бывает с другими.","Родина — это язык.","Свобода — это одиночество.","Часть речи — это поэзия.","Конец прекрасной эпохи — это жизнь."]},
  {author:"Андрей Вознесенский",quotes:["Я — Гойя! Глазницы воронок мне выклевал ворон.","Миллион алых роз из окна, из окна, из окна.","Ностальгия по настоящему.","Плачет девочка в автомате.","Жизнь — это миг.","Антимиры — это эпатаж.","Ров — это память."]},
  {author:"Евгений Евтушенко",quotes:["Поэт в России больше, чем поэт.","С меня довольно просто быть самим собой.","Людей неинтересных в мире нет.","Я разный — я натруженный и праздный.","Быть знаменитым некрасиво — это Пастернак, а я — Евтушенко.","Бабий Яр — это боль.","Наследники Сталина — это совесть."]},
  {author:"Роберт Рождественский",quotes:["Это надо не мёртвым, это надо живым.","Я, ты, он, она — вместе целая страна.","Мгновения — это жизнь.","Любовь — это песня.","Всё начинается с любви.","Реквием — это память.","Письмо в XXX век — это надежда."]},
  {author:"Белла Ахмадулина",quotes:["По улице моей который год звуки шагов, и нет твоих шагов.","Мне нравится, что вы больны не мной.","О, мой застенчивый герой.","Не плачьте обо мне, я просто ухожу.","Друзей моих медлительный уход.","Свеча — это жизнь.","Метель — это судьба."]},
  {author:"Николай Рубцов",quotes:["Тихая моя родина.","Я буду скакать по холмам задремавшей отчизны.","Русь моя, люблю твои берёзы.","В горнице моей светло.","Звезда полей — это моя звезда.","Листья осенние — это грусть.","Русский огонёк — это надежда."]},
  {author:"Даниил Хармс",quotes:["Раз, два, три, четыре, пять — вышел зайчик погулять.","Я — гений. И гений — это я.","Однажды я шёл по улице и упал.","Мир — это цирк.","Смысл — это абсурд.","Старуха — это смерть.","Случаи — это жизнь."]},
  {author:"Михаил Зощенко",quotes:["Люди — это звери.","Смех — это лекарство.","Быт — это война.","Человек — это скотина, но добрая.","Не надо бояться правды.","Голубая книга — это сатира.","Возвращённая молодость — это наука."]},
  {author:"Уильям Шекспир",quotes:["Быть или не быть — вот в чём вопрос.","Весь мир — театр, а люди в нём — актёры.","Любовь — это дым, поднимающийся от вздохов.","Нет ничего дурного в том, чтобы быть добрым.","Слова — это ветер, но они могут ранить.","Ромео и Джульетта — это любовь.","Гамлет — это трагедия."]},
  {author:"Иоганн Вольфганг Гёте",quotes:["Остановись, мгновенье, ты прекрасно!","Мы не должны смотреть на прошлое с сожалением.","Кто хочет много достигнуть, должен ставить высокие цели.","Любовь — это сила, которая движет миром.","Всякая жизнь — это эксперимент.","Фауст — это поиск.","Страдания юного Вертера — это чувства."]},
  {author:"Фридрих Шиллер",quotes:["Красота — это свобода в явлении.","Человек — это то, что он делает из себя.","Только тот, кто мечтает, может изменить мир.","Доброта — это язык, который понимают все.","Свобода — это право делать всё, что не вредит другим.","Разбойники — это бунт.","Вильгельм Телль — это свобода."]},
  {author:"Джордж Байрон",quotes:["Я не люблю людей, но я люблю человечество.","Слёзы — это дождь, который очищает душу.","Любовь — это неистовство, но она даёт силы жить.","Свобода — это всё, что у меня есть.","Печаль — это цена, которую мы платим за любовь.","Паломничество Чайльд-Гарольда — это путь.","Дон Жуан — это жизнь."]},
  {author:"Оскар Уайльд",quotes:["Быть собой — это единственный способ быть счастливым.","Всё, что я делаю, — это искусство.","Красота — это форма гения.","Я могу устоять перед всем, кроме соблазна.","Жизнь — это подражание искусству.","Портрет Дориана Грея — это трагедия.","Как важно быть серьёзным — это комедия."]},
  {author:"Бернард Шоу",quotes:["Жизнь — это не поиск себя, а создание себя.","Успех — это движение от одной неудачи к другой без потери энтузиазма.","Я не верю в обстоятельства. Я верю в себя.","Те, кто не могут изменить своё мнение, не могут изменить ничего.","Смысл жизни — в самой жизни.","Пигмалион — это преображение.","Дом, где разбиваются сердца — это трагедия."]},
  {author:"Джордж Оруэлл",quotes:["Война — это мир. Свобода — это рабство. Незнание — сила.","Все животные равны, но некоторые равнее других.","Свобода — это право говорить людям то, что они не хотят слышать.","В эпоху всеобщего обмана говорить правду — это революционный акт.","Большой Брат смотрит на тебя.","1984 — это антиутопия.","Скотный двор — это сатира."]},
  {author:"Эрнест Хемингуэй",quotes:["Мир ломает каждого, и многие становятся сильнее в сломанных местах.","Писать — это просто. Нужно сесть и выдавить из себя кровь.","Смелость — это сопротивление страху, а не его отсутствие.","Человек один не может ни черта.","Жизнь — это то, что происходит, пока ты строишь планы.","Старик и море — это подвиг.","Прощай, оружие! — это война."]},
  {author:"Фрэнсис Скотт Фицджеральд",quotes:["И вот я снова в том же месте, где начал.","Богатые — не такие, как мы.","В жизни главное — быть верным себе.","Мечты — это то, что заставляет нас двигаться вперёд.","Великий Гэтсби — это я.","Ночь нежна — это трагедия.","По ту сторону рая — это молодость."]},
  {author:"Марк Твен",quotes:["Слухи о моей смерти сильно преувеличены.","Никогда не откладывай на завтра то, что можно сделать послезавтра.","Лучший способ начать — перестать говорить и начать делать.","Доброта — это язык, который глухие могут слышать, а слепые — видеть.","Правда — самое ценное, что у нас есть.","Приключения Тома Сойера — это детство.","Приключения Гекльберри Финна — это свобода."]},
  {author:"Альберт Эйнштейн",quotes:["Воображение важнее знаний.","Только те, кто пытается сделать абсурдное, могут достичь невозможного.","Жизнь — как езда на велосипеде. Чтобы сохранить равновесие, ты должен двигаться.","Стремись не к успеху, а к ценности.","Логика приведёт вас от А к Б. Воображение приведёт вас куда угодно.","Теория относительности — это прорыв.","Мир — это загадка."]},
  {author:"Исаак Ньютон",quotes:["Если я видел дальше других, то потому, что стоял на плечах гигантов.","Я не знаю, каким я кажусь миру, но сам себе я кажусь мальчиком, играющим на берегу.","Всякая истина открывается нам через опыт.","Природа проста и не роскошествует излишними причинами.","Что мы знаем — капля, что мы не знаем — океан.","Законы Ньютона — это физика.","Оптика — это свет."]},
  {author:"Чарльз Дарвин",quotes:["Выживает не самый сильный, а самый восприимчивый к переменам.","Любовь к природе — это любовь к жизни.","Я не верю в теорию, которая не подтверждается фактами.","Наука — это организованное знание.","Всякая жизнь — это борьба за существование.","Происхождение видов — это эволюция.","Путешествие на корабле Бигль — это открытие."]},
  {author:"Зигмунд Фрейд",quotes:["Сны — это королевская дорога к бессознательному.","Человек — это животное, которое обещает.","Любовь и работа — вот что делает жизнь осмысленной.","Страх — это цена, которую мы платим за свободу.","Я не могу понять, что такое душа, но я знаю, что она есть.","Психоанализ — это метод.","Толкование сновидений — это наука."]},
  {author:"Фридрих Ницше",quotes:["Что не убивает меня, делает меня сильнее.","Бог умер.","Человек — это канат, натянутый между животным и сверхчеловеком.","Тот, кто имеет зачем жить, может вынести почти любое как.","Без музыки жизнь была бы ошибкой.","Так говорил Заратустра — это философия.","По ту сторону добра и зла — это мораль."]},
  {author:"Иммануил Кант",quotes:["Звёздное небо надо мной и моральный закон во мне.","Поступай так, чтобы твоя свобода была совместима со свободой других.","Знание — это сила, но мудрость — это доброта.","Человек — это цель, а не средство.","Долг — это уважение к самому себе.","Критика чистого разума — это философия.","Категорический императив — это мораль."]},
  {author:"Георг Гегель",quotes:["Всё действительное — разумно, всё разумное — действительно.","История — это прогресс в сознании свободы.","Диалектика — это движение мысли.","Человек — это дух, который познаёт себя.","Абсолютная идея — это Бог.","Феноменология духа — это система.","Наука логики — это метод."]},
  {author:"Артур Шопенгауэр",quotes:["Мир — это моё представление.","Воля — это сущность мира.","Жизнь — это страдание.","Гений — это человек, который видит мир иначе.","Счастье — это отсутствие страдания.","Мир как воля и представление — это философия.","Афоризмы житейской мудрости — это советы."]},
  {author:"Вольтер",quotes:["Я не согласен с вами, но я отдам жизнь за ваше право это сказать.","Люди — это игрушки в руках судьбы.","Все жанры хороши, кроме скучного.","История — это вымысел, в который все верят.","Бог — это гипотеза, которую я не могу доказать.","Кандид — это сатира.","Философские повести — это литература."]},
  {author:"Жан-Жак Руссо",quotes:["Человек рождается свободным, но повсюду он в оковах.","Природа — это источник добра.","Общество портит человека.","Назад к природе!","Свобода — это право делать всё, что не вредит другим.","Общественный договор — это теория.","Исповедь — это искренность."]},
  {author:"Мишель Монтень",quotes:["Я знаю, что я ничего не знаю.","Человек — это самое тщеславное животное.","Опыт — это единственный учитель.","Сомнение — это начало мудрости.","Жизнь — это искусство.","Опыты — это размышления.","Скептицизм — это метод."]},
  {author:"Франсуа де Ларошфуко",quotes:["У нас всегда хватает сил, чтобы переносить несчастья других.","Истинное красноречие — это умение сказать многое в немногих словах.","Любовь — это эгоизм вдвоём.","Мы обещаем так много, потому что боимся отказать.","Счастье — это здоровье и плохая память.","Максимы — это афоризмы.","Мемуары — это история."]},
  {author:"Блез Паскаль",quotes:["Человек — это тростник, но тростник мыслящий.","Сердце имеет свои законы, которых разум не знает.","Все несчастья людей происходят от того, что они не умеют спокойно сидеть в своей комнате.","Величие человека — в его способности мыслить.","Бог — это скрытая причина всех вещей.","Мысли — это философия.","Письма к провинциалу — это полемика."]},
  {author:"Сократ",quotes:["Я знаю, что ничего не знаю.","Познай самого себя.","Хорошо говоришь — хорошо мыслишь.","Добродетель — это знание.","Лучше терпеть несправедливость, чем совершать её.","Майевтика — это метод.","Философия — это жизнь."]},
  {author:"Платон",quotes:["Мир идей — это истинная реальность.","Душа — это бессмертная сущность.","Любовь — это стремление к красоте.","Справедливость — это гармония.","Философия — это искусство умирать.","Государство — это утопия.","Пир — это диалог."]},
  {author:"Аристотель",quotes:["Человек — это общественное животное.","Платон мне друг, но истина дороже.","Добродетель — это середина между двумя пороками.","Счастье — это деятельность души в полноте добродетели.","Все люди по природе стремятся к знанию.","Поэтика — это теория.","Метафизика — это наука."]},
  {author:"Диоген",quotes:["Я ищу человека.","Отойди, не заслоняй мне солнце.","Богатство — это не имущество, а душа.","Свобода — это единственное, что имеет цену.","Жизнь коротка, но слава вечна.","Кинизм — это философия.","Бочка — это дом."]},
  {author:"Эпикур",quotes:["Живи незаметно.","Смерть — это ничто для нас.","Удовольствие — это отсутствие страдания.","Дружба — это бессмертное благо.","Кто не помнит о прошлом, тот не умеет жить.","Сад Эпикура — это школа.","Атомизм — это физика."]},
  {author:"Марк Аврелий",quotes:["Живи так, будто ты умрёшь завтра. Учись так, будто ты будешь жить вечно.","Всё, что мы слышим, — это мнение, а не факт.","Наша жизнь — это то, что делают из неё наши мысли.","Лучший способ отомстить — не быть похожим на обидчика.","Счастье зависит от нас самих.","Размышления — это дневник.","Стоицизм — это философия."]},
  {author:"Сенека",quotes:["Мы страдаем больше в воображении, чем в реальности.","Учись радоваться.","Жизнь длинна, если ею умело пользоваться.","Нет ничего постыднее, чем быть в тягость другим.","Кто не благодарен, тот не способен быть счастливым.","Письма к Луцилию — это наставления.","О скоротечности жизни — это трактат."]},
  {author:"Цицерон",quotes:["Жизнь коротка, но слава вечна.","Ошибаться свойственно человеку, а упорствовать в ошибке — глупцу.","Дружба — это согласие во всём божественном и человеческом.","Свобода — это участие в управлении государством.","Бумага не краснеет.","Речи — это ораторское искусство.","Об обязанностях — это трактат."]},
  {author:"Конфуций",quotes:["Не важно, как медленно ты идёшь, важно, что ты не останавливаешься.","Выбери работу по душе, и тебе не придётся работать.","Три вещи никогда не возвращаются: время, слово, возможность.","Учиться и не размышлять — напрасный труд.","Не делай другому того, чего не желаешь себе.","Лунь юй — это беседы.","Жэнь — это гуманность."]},
  {author:"Лао-Цзы",quotes:["Путь в тысячу ли начинается с первого шага.","Знающий других — умён, знающий себя — мудр.","Вода — самое мягкое, но она точит камень.","Тот, кто знает, не говорит. Тот, кто говорит, не знает.","Быть собой — это высшая мудрость.","Дао дэ цзин — это канон.","У-вэй — это недеяние."]},
  {author:"Сунь-Цзы",quotes:["Знай врага и знай себя — и ты выйдешь победителем из тысячи битв.","Война — это путь обмана.","Быстрота — это сущность войны.","Лучшая победа — это победа без боя.","Порядок и хаос — это две стороны одной медали.","Искусство войны — это трактат.","Стратагемы — это хитрость."]},
  {author:"Будда",quotes:["Всё, что мы есть, — результат наших мыслей.","Не делай зла, делай добро, очищай свой ум.","Три вещи нельзя скрыть: солнце, луну и истину.","Побеждай гнев любовью, зло — добром.","Жизнь — это страдание, но страдание можно прекратить.","Дхарма — это учение.","Нирвана — это освобождение."]},
  {author:"Махатма Ганди",quotes:["Будь тем изменением, которое ты хочешь видеть в мире.","Сначала они тебя не замечают, потом смеются над тобой, потом борются с тобой, а потом ты побеждаешь.","Величие нации измеряется тем, как она относится к своим слабым.","Свобода ничего не стоит, если она не включает свободу ошибаться.","Глаз за глаз — и весь мир ослепнет.","Сатьяграха — это ненасилие.","Ахимса — это непричинение вреда."]},
  {author:"Нельсон Мандела",quotes:["Образование — самое мощное оружие, которым можно изменить мир.","Я не проигрываю. Я либо побеждаю, либо учусь.","Свобода — это не просто сбросить оковы, но жить, уважая свободу других.","Храбрость — это не отсутствие страха, а победа над ним.","Никогда не поздно делать то, что правильно.","Долгая дорога к свободе — это автобиография.","Апартеид — это расизм."]},
  {author:"Мартин Лютер Кинг",quotes:["У меня есть мечта.","Несправедливость где-либо — угроза справедливости везде.","Тьма не может изгнать тьму, только свет может это сделать.","Вершина величия — служить другим.","Мера человека — не то, как он ведёт себя в комфорте, а то, как он стоит в трудностях.","Письмо из бирмингемской тюрьмы — это манифест.","Я был на вершине горы — это речь."]},
  {author:"Уинстон Черчилль",quotes:["Успех — это способность идти от неудачи к неудаче, не теряя энтузиазма.","Никогда, никогда, никогда не сдавайтесь.","Пессимист видит трудности в каждой возможности, оптимист видит возможности в каждой трудности.","Я не могу обещать вам ничего, кроме крови, тяжёлого труда, слёз и пота.","Кто владеет информацией, тот владеет миром.","Вторая мировая война — это история.","Железный занавес — это речь."]},
  {author:"Джон Кеннеди",quotes:["Не спрашивай, что страна может сделать для тебя, спроси, что ты можешь сделать для страны.","Мы выбираем идти на Луну не потому, что это легко, а потому, что это трудно.","Свобода не даётся даром.","В кризис опаснее всего — бездействие.","Прощение — это сила, а не слабость.","Профили мужества — это книга.","Кубинский ракетный кризис — это история."]},
  {author:"Авраам Линкольн",quotes:["Я не знаю, кто был мой дед, но мне важнее, кем будет мой внук.","Почти все люди могут переносить несчастья, но если вы хотите проверить характер человека, дайте ему власть.","Лучше молчать и сойти за дурака, чем открыть рот и развеять все сомнения.","Дом, разделённый сам в себе, не устоит.","Я верю в Бога, но не в его священников.","Геттисбергская речь — это история.","Освобождение рабов — это прогресс."]},
  {author:"Бенджамин Франклин",quotes:["Время — деньги.","Не откладывай на завтра то, что можно сделать сегодня.","Кто покупает лишнее, продаёт необходимое.","Свобода — это право делать всё, что не вредит другим.","Бог помогает тем, кто помогает себе сам.","Альманах бедного Ричарда — это мудрость.","Автобиография — это история."]},
  {author:"Томас Эдисон",quotes:["Гений — это один процент вдохновения и девяносто девять процентов пота.","Я не терпел поражений. Я просто нашёл 10 000 способов, которые не работают.","Наш величайший недостаток — мы слишком быстро сдаёмся.","Лучший способ сделать великое — начать с малого.","Всё приходит к тому, кто работает и ждёт.","Лампа накаливания — это изобретение.","Фонограф — это звук."]},
  {author:"Никола Тесла",quotes:["Настоящий учёный не может быть узким специалистом.","Если вы хотите понять Вселенную, думайте в терминах энергии, частоты и вибрации.","Изобретатель — это человек, который видит то, чего ещё нет.","Мой мозг — это только приёмник.","Будущее принадлежит тем, кто готов к нему.","Переменный ток — это энергия.","Тесла — это гений."]},
  {author:"Стив Джобс",quotes:["Оставайтесь голодными, оставайтесь безрассудными.","У вас уже есть всё, что нужно, чтобы начать.","Иногда жизнь бьёт вас по голове кирпичом. Не теряйте веры.","Лучше быть пиратом, чем служить во флоте.","Инновация отличает лидера от догоняющего.","Apple — это революция.","iPhone — это будущее."]},
  {author:"Билл Гейтс",quotes:["Если вы думаете, что можете, вы правы. Если думаете, что не можете, вы тоже правы.","Успех — это плохой учитель. Он заставляет думать, что вы не можете проиграть.","Я выбираю ленивого человека для тяжёлой работы. Потому что ленивый найдёт легкий способ её сделать.","Бизнес — это увлекательнейшая игра.","Знания — это сила.","Microsoft — это софт.","Windows — это система."]},
  {author:"Генри Форд",quotes:["Если бы я спросил людей, чего они хотят, они бы сказали: более быстрых лошадей.","Собраться вместе — это начало. Оставаться вместе — это прогресс. Работать вместе — это успех.","Качество — это делать всё правильно, даже когда никто не смотрит.","Неудача — это возможность начать снова, но более умно.","Время не любит, когда его тратят впустую.","Конвейер — это революция.","Model T — это автомобиль."]},
  {author:"Дейл Карнеги",quotes:["Улыбка ничего не стоит, но многое даёт.","Имя человека — самый сладкий и самый важный звук для него.","Не критикуйте, не осуждайте, не жалуйтесь.","Люди, которые счастливы, не жалуются.","Будьте заняты. Это самое дешёвое лекарство на земле.","Как завоёвывать друзей — это бестселлер.","Как перестать беспокоиться — это практика."]},
  {author:"Стивен Кови",quotes:["Начните с конца в уме.","Будьте проактивны.","Сначала стремитесь понять, потом быть понятым.","Синергия — это высшая форма сотрудничества.","Затачивайте пилу.","Семь навыков — это система.","Главное — в главном."]},
  {author:"Ральф Уолдо Эмерсон",quotes:["Будь собой, все остальные роли уже заняты.","Успех — это смеяться часто и любить много.","Что ты делаешь, то и есть ты.","Доверяй себе.","Знание — это сила, но характер — это больше.","Природа — это книга.","Self-Reliance — это эссе."]},
  {author:"Генри Дэвид Торо",quotes:["Я пошёл в леса, потому что хотел жить осознанно.","Большинство людей ведут жизнь тихого отчаяния.","Богатство — это способность полноценно переживать жизнь.","Упрощай, упрощай, упрощай.","Не тот беден, у кого мало, а тот, кто хочет много.","Уолден — это книга.","Гражданское неповиновение — это эссе."]},
  {author:"Уолт Уитмен",quotes:["Я большой, я вмещаю множество.","О, капитан, мой капитан!","Всё идёт вперёд, ничто не разрушается.","Я воспеваю себя, я воспеваю тебя.","Жизнь — это поэзия.","Листья травы — это сборник.","Песня о себе — это гимн."]},
  {author:"Эдгар Аллан По",quotes:["Ворон сказал: никогда.","Я не сумасшедший, я просто безумен.","Тьма — это моя стихия.","Сердце — это лютня.","Мечта внутри мечты.","Ворон — это поэма.","Убийство на улице Морг — это детектив."]},
  {author:"Джек Лондон",quotes:["Жизнь — это огонь. Она либо горит, либо гаснет.","Я предпочитаю быть пеплом, чем пылью.","Зов предков — это голос крови.","Смысл жизни — в движении.","Белый клык — это я.","Мартин Иден — это трагедия.","Морской волк — это приключение."]},
  {author:"Рэй Брэдбери",quotes:["Книги — это наши друзья.","451 градус по Фаренгейту — это температура, при которой горит бумага.","Мы не должны бояться будущего.","Пишите каждый день.","Фантазия — это реальность.","Вино из одуванчиков — это детство.","Марсианские хроники — это фантастика."]},
  {author:"Курт Воннегут",quotes:["Так идёт жизнь.","Мы — то, что мы делаем.","Смех — это лучшее лекарство.","Всё будет хорошо, и всё будет плохо.","Пишите, чтобы понять мир.","Бойня номер пять — это антиутопия.","Колыбель для кошки — это сатира."]},
  {author:"Стивен Кинг",quotes:["Творчество — это магия.","Читайте много, пишите много.","Страх — это топливо.","Монстры реальны, но и добро тоже.","Пишите правду.","Оно — это ужас.","Сияние — это безумие."]},
  {author:"Агата Кристи",quotes:["Лучший способ успокоить нервы — загадка.","Я специалист по убийствам, но не убийца.","Люди — это загадки.","Правда всегда всплывает.","Детектив — это игра ума.","Убийство в Восточном экспрессе — это классика.","Десять негритят — это триллер."]},
  {author:"Артур Конан Дойл",quotes:["Элементарно, Ватсон.","Нет ничего более обманчивого, чем очевидный факт.","Данные! Данные! Данные!","Мой мозг — это чердак.","Дедукция — это искусство.","Шерлок Холмс — это гений.","Собака Баскервилей — это ужас."]},
  {author:"Джоан Роулинг",quotes:["Мы не выбираем, кто мы есть. Мы выбираем, что делать.","Счастье можно найти, даже в самые тёмные времена.","Важно не то, что ты родился, а то, кем ты стал.","Смелость — это не отсутствие страха.","Всегда.","Гарри Поттер — это магия.","Хогвартс — это дом."]},
  {author:"Льюис Кэрролл",quotes:["Мы все здесь не в своём уме.","Если ты не знаешь, куда идёшь, то любая дорога приведёт тебя туда.","Всё страньше и страньше.","Улыбка без кота.","Время — это иллюзия.","Алиса в Стране чудес — это сон.","Зазеркалье — это отражение."]},
  {author:"Антуан де Сент-Экзюпери",quotes:["Мы в ответе за тех, кого приручили.","Самого главного глазами не увидишь.","Взрослые — это странные люди.","Любовь — это когда смотришь в одном направлении.","Слова — это источник недоразумений.","Маленький принц — это сказка.","Планета людей — это философия."]},
  {author:"Виктор Гюго",quotes:["Собор Парижской Богоматери — это душа Парижа.","Музыка — это язык души.","Ничто не может остановить идею, время которой пришло.","Жизнь — это трагедия для тех, кто чувствует, и комедия для тех, кто думает.","Свобода — это право быть собой.","Отверженные — это эпопея.","Девяносто третий год — это революция."]},
  {author:"Оноре де Бальзак",quotes:["Брак — это наука.","Деньги — это кровь общества.","Человек — это раб своих страстей.","Тайна — это двигатель жизни.","Всё в мире держится на деньгах.","Человеческая комедия — это эпопея.","Гобсек — это скупость."]},
  {author:"Эмиль Золя",quotes:["Искусство — это природа, увиденная через темперамент.","Правда — это сила.","Жизнь — это борьба.","Я обвиняю!","Свобода — это право говорить правду.","Ругон-Маккары — это сага.","Жерминаль — это шахтёры."]},
  {author:"Ги де Мопассан",quotes:["Жизнь — это гора, на которую мы взбираемся, а смерть — это спуск.","Любовь — это единственное, что имеет цену.","Одиночество — это богатство.","Женщина — это загадка.","Красота — это сила.","Милый друг — это карьера.","Пышка — это рассказ."]},
  {author:"Альбер Камю",quotes:["Я бунтую, значит, мы существуем.","Абсурд — это разрыв между человеком и миром.","Нужно представлять себе Сизифа счастливым.","Свобода — это возможность быть собой.","Жизнь — это выбор.","Посторонний — это абсурд.","Чума — это аллегория."]},
  {author:"Жан-Поль Сартр",quotes:["Человек осуждён быть свободным.","Существование предшествует сущности.","Ад — это другие.","Мы — это наши выборы.","Свобода — это ответственность.","Бытие и ничто — это философия.","Тошнота — это роман."]},
  {author:"Франц Кафка",quotes:["Превращение — это метафора жизни.","Я — это мои книги.","Процесс — это жизнь.","Замок — это недостижимая цель.","Смысл — это отсутствие смысла.","Превращение — это метафора.","Замок — это абсурд."]},
  {author:"Томас Манн",quotes:["Волшебная гора — это метафора времени.","Будденброки — это история упадка.","Смерть в Венеции — это красота.","Болезнь — это особое состояние духа.","Творчество — это жизнь.","Доктор Фаустус — это трагедия.","Иосиф и его братья — это миф."]},
  {author:"Генрих Гейне",quotes:["Лорелея — это душа Германии.","Я не знаю, что это значит, но я чувствую это.","Любовь — это боль.","Поэт — это пророк.","Свобода — это жизнь.","Книга песен — это лирика.","Германия. Зимняя сказка — это сатира."]},
  {author:"Райнер Мария Рильке",quotes:["Ты должен изменить свою жизнь.","Красота — это начало ужаса.","Бог — это будущее.","Одиночество — это богатство.","Смерть — это последняя любовь.","Часослов — это поэзия.","Дуинские элегии — это философия."]},
  {author:"Герман Гессе",quotes:["Сиддхартха — это путь.","Степной волк — это я.","Игра в бисер — это синтез.","Каждый человек — это путь.","Ты должен найти свой путь.","Демиан — это юность.","Нарцисс и Гольдмунд — это дружба."]},
  {author:"Стефан Цвейг",quotes:["Шахматная новелла — это гений.","Любовь — это наваждение.","Жизнь — это мгновение.","Величие — это трагедия.","Свобода — это одиночество.","24 часа из жизни женщины — это рассказ.","Письмо незнакомки — это трагедия."]},
  {author:"Хорхе Луис Борхес",quotes:["Вавилонская библиотека — это вселенная.","Сад расходящихся тропок — это время.","Я — это другой.","Память — это лабиринт.","Книга — это зеркало.","Вымышленные истории — это фантастика.","Алеф — это бесконечность."]},
  {author:"Габриэль Гарсиа Маркес",quotes:["Сто лет одиночества — это жизнь.","Не плачь, что кончилось, улыбнись, что было.","Любовь во время чумы — это судьба.","Одиночество — это проклятие.","Жизнь — это магия.","Полковнику никто не пишет — это отчаяние.","Осень патриарха — это власть."]},
  {author:"Пабло Неруда",quotes:["Я хочу делать с тобой то, что весна делает с вишнями.","Любовь — это короткая, но вечная тайна.","Поэзия — это жизнь.","Свобода — это право быть собой.","Я пишу, потому что я живу.","Двадцать стихотворений о любви — это лирика.","Вершины Мачу-Пикчу — это история."]},
  {author:"Федерико Гарсиа Лорка",quotes:["Зелёный ветер, зелёный ветер.","Кровь — это жизнь.","Смерть — это часть жизни.","Любовь — это трагедия.","Поэзия — это правда.","Кровавая свадьба — это драма.","Дом Бернарды Альбы — это трагедия."]},
  {author:"Данте Алигьери",quotes:["Оставь надежду, всяк сюда входящий.","Божественная комедия — это путь души.","Любовь — это сила, которая движет солнце и другие звёзды.","Ад — это состояние души.","Рай — это свет.","Чистилище — это искупление.","Новая жизнь — это любовь."]},
  {author:"Леонардо да Винчи",quotes:["Простота — это высшая мудрость.","Учиться никогда не поздно.","Знание — это сила.","Искусство — это зеркало природы.","Всё связано со всем.","Мона Лиза — это загадка.","Тайная вечеря — это шедевр."]},
  {author:"Микеланджело",quotes:["Я вижу ангела в мраморе и освобождаю его.","Творчество — это божественный дар.","Красота — это вечность.","Искусство — это труд.","Совершенство — это цель.","Давид — это статуя.","Сикстинская капелла — это роспись."]},
  {author:"Винсент Ван Гог",quotes:["Я мечтаю о своей картине, а потом пишу её.","Жёлтый — это цвет счастья.","Жизнь — это страдание, но искусство вечно.","Я не могу жить без живописи.","Ночь — это звёзды.","Подсолнухи — это цветы.","Звёздная ночь — это картина."]},
  {author:"Пабло Пикассо",quotes:["Искусство — это ложь, которая помогает нам понять правду.","Я не ищу, я нахожу.","Вдохновение существует, но оно должно застать тебя за работой.","Хороший художник копирует, великий — ворует.","Всё, что можно вообразить, реально.","Герника — это картина.","Авиньонские девицы — это кубизм."]},
  {author:"Сальвадор Дали",quotes:["Сюрреализм — это я.","Я не сумасшедший, я просто не такой, как все.","Время — это мягкое.","Красота — это сон.","Искусство — это провокация.","Постоянство памяти — это картина.","Сон, вызванный полётом пчелы — это шедевр."]},
  {author:"Людвиг ван Бетховен",quotes:["Музыка — это откровение.","Я схвачу судьбу за глотку.","Свобода и прогресс — вот цель искусства.","Музыка — это язык богов.","Творчество — это жизнь.","Лунная соната — это музыка.","Девятая симфония — это гимн."]},
  {author:"Вольфганг Амадей Моцарт",quotes:["Музыка — это гармония.","Мелодия — это сущность музыки.","Я пишу так, как чувствую.","Гений — это труд.","Красота — это вечность.","Дон Жуан — это опера.","Волшебная флейта — это сказка."]},
  {author:"Иоганн Себастьян Бах",quotes:["Цель музыки — прославлять Бога.","Труд — это молитва.","Гармония — это божественный порядок.","Музыка — это математика души.","Творчество — это служение.","Страсти по Матфею — это оратория.","Бранденбургские концерты — это музыка."]},
  {author:"Фридерик Шопен",quotes:["Музыка — это моя душа.","Ноктюрн — это ночь.","Родина — это моя боль.","Любовь — это музыка.","Я пишу для фортепиано.","Революционный этюд — это музыка.","Мазурки — это Польша."]},
  {author:"Пётр Чайковский",quotes:["Вдохновение — это гость, который не любит посещать ленивых.","Музыка — это исповедь души.","Красота — это спасение.","Творчество — это мука и счастье.","Я пишу для людей.","Лебединое озеро — это балет.","Щелкунчик — это сказка."]},
  {author:"Сергей Рахманинов",quotes:["Музыка — это жизнь.","Я русский композитор.","Мелодия — это душа.","Творчество — это труд.","Любовь — это вдохновение.","Второй концерт — это музыка.","Всенощное бдение — это духовная музыка."]},

  {author:"Игорь Стравинский",quotes:["Весна священная — это революция.","Музыка — это ритм.","Традиция — это основа.","Новаторство — это жизнь.","Я не ищу, я создаю.","Петрушка — это балет.","Жар-птица — это сказка."]}
];

var allQuotes = [];
for (var i = 0; i < authorsData.length; i++) {
  var a = authorsData[i].author;
  for (var j = 0; j < authorsData[i].quotes.length; j++) {
    allQuotes.push({ author: a, text: authorsData[i].quotes[j] });
  }
}

var authorsList = [];
for (var i = 0; i < authorsData.length; i++) authorsList.push(authorsData[i].author);
authorsList.sort(function(a, b) { return a.localeCompare(b, 'ru'); });

var quotesWrap = document.getElementById('quotes-wrap');
var authorsBox = document.getElementById('authors-box');
var resultsInfo = document.getElementById('results-info');
var searchInput = document.getElementById('search-input');

function renderAuthors() {
  var html = '';
  for (var i = 0; i < authorsList.length; i++) {
    html += '<a href="#" data-author="' + authorsList[i] + '">' + authorsList[i] + '</a>';
  }
  authorsBox.innerHTML = html;
}

function renderQuotes(list, info) {
  if (list.length === 0) {
    quotesWrap.innerHTML = '<div style="text-align:center;color:#888;padding:30px 0;font-style:italic;">Ничего не найдено. Попробуйте другой запрос.</div>';
    resultsInfo.textContent = info || 'Найдено 0 цитат';
    return;
  }
  var half = Math.ceil(list.length / 2);
  var leftCol = list.slice(0, half);
  var rightCol = list.slice(half);
  var html = '<div class="quote-col">' + renderColumn(leftCol) + '</div>';
  html += '<div class="quote-col">' + renderColumn(rightCol) + '</div>';
  quotesWrap.innerHTML = html;
  resultsInfo.textContent = info || ('Показано цитат: ' + list.length);
}

function renderColumn(list) {
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += '<div class="quote-item">';
    html += '<div class="text">' + list[i].text + '</div>';
    html += '<div class="author"><a href="#" data-author="' + list[i].author + '">— ' + list[i].author + '</a></div>';
    html += '</div>';
  }
  return html;
}

function showAll() {
  renderQuotes(allQuotes, 'Показаны все цитаты (' + allQuotes.length + ')');
  var links = authorsBox.querySelectorAll('a');
  for (var i = 0; i < links.length; i++) links[i].classList.remove('active');
}

function showAuthor(author) {
  var list = [];
  for (var i = 0; i < allQuotes.length; i++) {
    if (allQuotes[i].author === author) list.push(allQuotes[i]);
  }
  renderQuotes(list, 'Цитаты автора: ' + author + ' (' + list.length + ')');
  var links = authorsBox.querySelectorAll('a');
  for (var i = 0; i < links.length; i++) {
    links[i].classList.remove('active');
    if (links[i].getAttribute('data-author') === author) links[i].classList.add('active');
  }
  window.scrollTo(0, 0);
}

function doSearch() {
  var q = searchInput.value.trim().toLowerCase();
  if (q === '') { showAll(); return; }
  var list = [];
  for (var i = 0; i < allQuotes.length; i++) {
    var text = allQuotes[i].text.toLowerCase();
    var author = allQuotes[i].author.toLowerCase();
    if (text.indexOf(q) !== -1 || author.indexOf(q) !== -1) list.push(allQuotes[i]);
  }
  renderQuotes(list, 'Результаты поиска: "' + searchInput.value.trim() + '" (' + list.length + ')');
}

authorsBox.addEventListener('click', function(e) {
  if (e.target.tagName === 'A' && e.target.getAttribute('data-author')) {
    e.preventDefault();
    showAuthor(e.target.getAttribute('data-author'));
  }
});

quotesWrap.addEventListener('click', function(e) {
  if (e.target.tagName === 'A' && e.target.getAttribute('data-author')) {
    e.preventDefault();
    showAuthor(e.target.getAttribute('data-author'));
  }
});

searchInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});

renderAuthors();
showAll();
</script>
</body>
</html>
